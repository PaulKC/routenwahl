<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skitour Webapp</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div id="hint"></div>
    <div><span class="pin start">A</span> Start: <span id="start-coords">–</span></div>
    <div><span class="pin end">B</span> Ziel: <span id="end-coords">–</span></div>
    <div id="elevation-status"></div>
    <div id="route-status"></div>
    <button id="reset" type="button">Zurücksetzen</button>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
